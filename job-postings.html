<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Job Postings — Recruitment Management System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/frost-ui.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>
    <body data-active="Job Postings" class="app-page">
        <aside id="appSidebar" class="sidebar glass-panel"></aside>
        <main class="app-main">
            <header id="appTopbar" class="topbar glass-panel"></header>
            <section class="page-content">
                <div class="page-intro">
                    <div>
                        <p class="eyebrow">Vacancy management</p>
                        <h2>Job Postings</h2>
                        <p>Create, review, search, close, and reopen recruitment opportunities.</p>
                    </div>
                    <button class="btn btn-primary" id="openAddModal">＋ Add Job Posting</button>
                </div>
                <section class="glass-panel section-card">
                    <div class="toolbar">
                        <div class="search-wrap">
                            <span class="search-icon">⌕</span>
                            <input id="jobSearch" type="search" placeholder="Search job code, position, or department">
                        </div>
                        <select id="statusFilter" class="select-control">
                            <option value="">All statuses</option>
                            <option value="Open">Open</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Job Code</th>
                                    <th>Position</th>
                                    <th>Department</th>
                                    <th>Employment</th>
                                    <th>Vacancies</th>
                                    <th>Posted</th>
                                    <th>Closing</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="jobsTable">
                                <tr>
                                    <td colspan="9" class="table-empty">Loading job postings…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </section>
        </main>
        <div id="toastRoot" class="toast-root"></div>

        <!-- =================================================
     ADD / EDIT JOB POSTING MODAL
     ================================================= -->

<div
    id="jobPostingModal"
    class="modal-backdrop"
    aria-hidden="true"
>
    <div
        class="modal glass-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="jobModalTitle"
    >

        <div class="modal-head">

            <div>
                <p class="eyebrow">Vacancy management</p>

                <h3 id="jobModalTitle">
                    Add Job Posting
                </h3>
            </div>

            <button
                type="button"
                class="icon-button"
                id="closeJobModal"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <form id="jobPostingForm" novalidate>

            <div class="form-grid">

                <div class="form-group">
                    <label for="jobCode">
                        Job Code *
                    </label>

                    <input
                        id="jobCode"
                        type="text"
                        placeholder="JOB-001"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="jobTitle">
                        Position *
                    </label>

                    <input
                        id="jobTitle"
                        type="text"
                        placeholder="Software Developer"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="department">
                        Department *
                    </label>

                    <input
                        id="department"
                        type="text"
                        placeholder="IT Department"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="employmentType">
                        Employment Type *
                    </label>

                    <select
                        id="employmentType"
                        required
                    >
                        <option value="">
                            Select employment type
                        </option>

                        <option value="Full-time">
                            Full-time
                        </option>

                        <option value="Part-time">
                            Part-time
                        </option>

                        <option value="Contract">
                            Contract
                        </option>

                        <option value="Temporary">
                            Temporary
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="vacancies">
                        Vacancies *
                    </label>

                    <input
                        id="vacancies"
                        type="number"
                        min="1"
                        placeholder="1"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="jobStatus">
                        Status *
                    </label>

                    <select
                        id="jobStatus"
                        required
                    >
                        <option value="Open">
                            Open
                        </option>

                        <option value="Closed">
                            Closed
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="postingDate">
                        Posting Date *
                    </label>

                    <input
                        id="postingDate"
                        type="date"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="closingDate">
                        Closing Date *
                    </label>

                    <input
                        id="closingDate"
                        type="date"
                        required
                    >
                </div>


                <div class="form-group full-field">
                    <label for="jobDescription">
                        Job Description *
                    </label>

                    <textarea
                        id="jobDescription"
                        rows="4"
                        placeholder="Describe the position..."
                        required
                    ></textarea>
                </div>


                <div class="form-group full-field">
                    <label for="qualifications">
                        Qualifications *
                    </label>

                    <textarea
                        id="qualifications"
                        rows="4"
                        placeholder="Enter required qualifications..."
                        required
                    ></textarea>
                </div>

            </div>


            <div class="button-row">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelJobModal"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Job Posting
                </button>

            </div>

        </form>

    </div>
</div>
<!-- =================================================
     VIEW JOB POSTING MODAL
     ================================================= -->

<div
    id="viewJobModal"
    class="modal-backdrop"
    aria-hidden="true"
>
    <div
        class="modal glass-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="viewJobModalTitle"
    >

        <div class="modal-head">

            <div>
                <p class="eyebrow">Vacancy management</p>

                <h3 id="viewJobModalTitle">
                    Job Posting Details
                </h3>
            </div>

            <button
                type="button"
                class="icon-button"
                id="closeViewJobModal"
                aria-label="Close"
            >
                ×
            </button>

        </div>

        <div
            id="viewJobBody"
            class="profile-grid"
        ></div>

        <div class="button-row">

            <button
                type="button"
                class="btn btn-secondary"
                id="closeViewJob"
            >
                Close
            </button>

        </div>

    </div>
</div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/config.js"></script>
        <script src="js/supabase.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/components.js"></script>
        <script src="js/job-postings.js"></script>
    </body>
</html>
